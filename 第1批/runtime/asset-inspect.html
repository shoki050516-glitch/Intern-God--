<!DOCTYPE html><html lang="zh"><head>
  <meta charset="utf-8">
  <title>资产检视</title>
  <style>    html, body { margin: 0; height: 100%; background: #111926; color: #e6e9ef; font-family: system-ui, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 10px; top: 10px; font-size: 11px; line-height: 1.7; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #hud b { color: #7dd3a0; }
    #hud .dim { color: #8b95a7; }
    #hud .warn { color: #ffcf8b; }
    #clips { position: fixed; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 20px); }
    #clips button { padding: 3px 9px; font-size: 11px; color: #e6e9ef; background: rgba(20,26,38,.85); border: 1px solid rgba(255,255,255,.22); border-radius: 5px; cursor: pointer; }
    #clips button.on { color: #101722; background: #7dd3a0; border-color: #7dd3a0; }
    #clips span { align-self: center; font-size: 11px; color: #8b95a7; }
    #err { position: fixed; inset: 0; display: none; place-content: center; padding: 24px; text-align: center; font-size: 13px; color: #ff9b9b; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; font-size: 13px; pointer-events: none; }
    #loading[hidden] { display: none; }
  </style>
  <script type="importmap">
    {"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="clips"></div>
  <div id="err"></div>
  <div id="loading">正在加载资产…</div>
  <script type="module">import('./asset-inspect.js').then(module => module.inspectionReady).then(() => {document.getElementById('loading').hidden=true;}).catch(() => {document.getElementById('loading').hidden=true;const error=document.getElementById('err');error.textContent='检视模块加载失败，请重试；已有资产文件仍保留。';error.style.display='grid';});</script>

</body></html>
